name: Verify static website
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify ${{ matrix.mode }} export
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [preview, production]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/build-site
        with:
          mode: ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.mode }}
          path: |
            artifacts/
            test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ matrix.mode }}
          path: out
